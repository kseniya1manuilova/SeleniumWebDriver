#region LoginPage
LoginPage.EmailInput=css=input[name='email']
LoginPage.PasswordInput=css=input[name='password']
LoginPage.RememberMeCheckBoxInput=css=input[name='remember_me']
LoginPage.LoginButton=css=button[name='login']
LoginPage.NoticeText=css=div.notice
#endregion

#region CartPage
CartPage.CartLink=css=#cart a.link
CartPage.EmptyCartText=css=#checkout-cart-wrapper em
CartPage.OrderSummaryText=xpath=//h2[@class='title' and text()='Order Summary']
#endregion

#region ItemPage
ItemPage.AddButton=css=button[name='add_cart_product']
ItemPage.SelectSizeButton=name=options[Size]
#endregion

#region CategoriesPage
CategoriesPage.CategoriesPageLink=css=li.category-1
CategoriesPage.SubCategoriesPageLink=css=li.category-2 > a[href*='subcategory-c-2']
CategoriesPage.YellowDuckLink=css=a[title='Yellow Duck']
#endregion
